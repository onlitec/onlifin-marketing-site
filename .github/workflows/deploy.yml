name: 🚀 Deploy Marketing Site

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

env:
  DOCKER_ORG: onlitec
  IMAGE_NAME: onlifin-marketing-site

jobs:
  # ===========================================
  # Job 1: Build e Push da Imagem Docker
  # ===========================================
  build-and-push:
    name: 🐳 Build & Push Docker (Marketing)
    runs-on: ubuntu-latest
    
    outputs:
      version: ${{ steps.version.outputs.version }}
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🏷️ Gerar versão
        id: version
        run: |
          VERSION=$(date +'%Y.%m.%d')-$(echo ${{ github.sha }} | cut -c1-7)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Versão: $VERSION"

      - name: 🔐 Login no DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🛠️ Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build e Push - Marketing
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_ORG }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================
  # Job 2: Notificação
  # ===========================================
  notify:
    name: 📢 Notificar
    runs-on: ubuntu-latest
    needs: build-and-push
    if: always()
    
    steps:
      - name: 📝 Resumo do Deploy
        run: |
          echo "## 🚀 Deploy Marketing Site" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Versão** | ${{ needs.build-and-push.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build** | ${{ needs.build-and-push.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ℹ️ *A imagem já está disponível no DockerHub com a tag acima para uso no Portainer/VPS.*" >> $GITHUB_STEP_SUMMARY
