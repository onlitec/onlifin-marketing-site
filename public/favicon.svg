<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="OnliFin">
  <title>OnliFin</title>
  <!-- Desk: the graphite ground of the site. -->
  <rect width="64" height="64" rx="14" fill="#131518"/>
  <rect x=".5" y=".5" width="63" height="63" rx="13.5" fill="none" stroke="#2c3035"/>
  <!-- The tape's total sign: two ribbon bars, square-cut like the wordmark. Sizes are multiples of 4 so the bars stay pixel-sharp at 16, 32 and 48px. -->
  <rect x="12" y="20" width="40" height="8" fill="#ff6b4e"/>
  <rect x="12" y="36" width="40" height="8" fill="#ff6b4e"/>
</svg>
