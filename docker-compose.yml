version: '3.8'

services:
  marketing:
    container_name: onlifin-marketing
    build: .
    environment:
      - PLATFORM_BASE_URL=https://onlifin.com.br/app/
    ports:
      - "8081:80"
    volumes:
      # A config tambem e copiada na imagem (Dockerfile), mas o bind-mount
      # garante que alteracoes valham apos um recreate sem reconstruir a imagem
      # — a imagem de 17/05 ficou 3 meses com um rate limit desatualizado.
      - ./nginx-marketing.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      onlifin-network:
        aliases:
          - onlifin-marketing
      # CORREÇÃO: adicionado proxy_net — padrão correto para Nginx Proxy Manager
      proxy_net: {}
    restart: unless-stopped
    security_opt:
      - apparmor:unconfined
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  onlifin-network:
    name: onlifin-network
    external: true
  proxy_net:
    external: true
