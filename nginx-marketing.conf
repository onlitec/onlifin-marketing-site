# Todo o trafego chega via Cloudflare Tunnel (cloudflared), entao
# $binary_remote_addr seria sempre o gateway do Docker (172.2x.0.1) e o rate
# limit valeria para TODOS os usuarios somados, e nao por usuario. Recuperamos
# o IP real do visitante a partir do header CF-Connecting-IP.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 127.0.0.1;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# SECURITY: rate limiting por IP real do visitante.
# O painel dispara ~14 requisicoes na carga inicial; burst=60 da folga
# confortavel sem abrir mao da protecao contra abuso.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# Mapeamento para persistência de sessão via cookie no gateway
map $cookie_onlifin_auth_session $onlifin_auth_header {
    default "Bearer $cookie_onlifin_auth_session";
    "" "";
}

# Prioriza o cookie de sessão sobre o header Authorization do cliente (evita sobrescrever com token anon)
map $cookie_onlifin_auth_session $final_auth_header {
    "~.+" "$onlifin_auth_header";
    default "$http_authorization";
}

# Mapeamento dinâmico para suportar múltiplos domínios CORS paralelamente
map $http_origin $cors_origin {
    default "https://onlifin.com.br";
    "~^https://onlifin\.onlitec\.com\.br$" "$http_origin";
    "~^https://onlifin\.com\.br$" "$http_origin";
    "~^http://localhost(:\d+)?$" "$http_origin";
}

server {
    listen 80;
    server_name onlifin.com.br onlifin.onlitec.com.br localhost;
    absolute_redirect off;
    resolver 127.0.0.11 ipv6=off valid=10s;

    set $notification_worker_upstream http://onlifin-notification-worker:8091/;
    set $billing_api_upstream http://onlifin-billing-api:8092;
    set $api_upstream http://onlifin-api:3000;
    set $ollama_upstream http://onlifin-ollama:11434;
    set $app_upstream http://onlifin-app;
    set $super_admin_upstream http://onlifin-super-admin;

    # SECURITY: rate limiting por IP (removed from here)

    location = /api/worker/notification-health {
        proxy_pass $notification_worker_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        # SECURITY: rate limiting na API
        limit_req zone=api_limit burst=60 nodelay;

        rewrite ^/api/rest/v1/(.*)$ /$1 break;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $final_auth_header;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SECURITY: CORS restrito ao domínio da aplicação
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,Prefer' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    location /api/billing/ {
        # SECURITY: rate limiting no billing
        limit_req zone=api_limit burst=60 nodelay;

        rewrite ^/api/billing/(.*)$ /$1 break;
        proxy_pass $billing_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $final_auth_header;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SECURITY: CORS restrito
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,Prefer,asaas-access-token' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # SECURITY: Ollama bloqueado — não deve ser acessível publicamente
    # Sem autenticação, qualquer um pode carregar/deletar modelos e consumir recursos
    location /ollama/ {
        return 403;
        # Para reabilitar com autenticação futura, descomente e adicione auth_request:
        # rewrite ^/ollama/(.*)$ /$1 break;
        # proxy_pass $ollama_upstream;
    }

    location = /login { return 302 /app/login$is_args$args; }
    location = /pf    { return 302 /app/pf$is_args$args; }
    location = /pj    { return 302 /app/pj$is_args$args; }

    location ^~ /app/assets/ {
        rewrite ^/app/(.*)$ /$1 break;
        proxy_pass $app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 1y;
    }

    location = /app/sw.js {
        rewrite ^/app/(.*)$ /$1 break;
        proxy_pass $app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    location = /app/version.json {
        rewrite ^/app/(.*)$ /$1 break;
        proxy_pass $app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    location = /app/manifest.json {
        rewrite ^/app/(.*)$ /$1 break;
        proxy_pass $app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        expires 5m;
    }

    location /app/ {
        rewrite ^/app/(.*)$ /$1 break;
        proxy_pass $app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    location /super-admin/ {
        rewrite ^/super-admin/(.*)$ /$1 break;
        proxy_pass $super_admin_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /super-admin {
        return 302 /super-admin/;
    }

    location = /app {
        return 302 /app/;
    }

    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires -1;
        try_files /sw.js =404;
    }

    # Fontes self-hosted: nomes estaveis, entao cache longo sem "immutable".
    location ^~ /fonts/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    # SECURITY: headers de segurança HTTP globais
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    server_tokens off;
}
